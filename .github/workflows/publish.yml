name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example v0.4.1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ArielSmoliar/loco-agent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate release source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os, re, subprocess, tomllib
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag):
              raise SystemExit('Expected a vMAJOR.MINOR.PATCH release tag')
          with open('pyproject.toml', 'rb') as source:
              version = tomllib.load(source)['project']['version']
          if tag != f'v{version}':
              raise SystemExit('Tag and package version differ')
          subprocess.run(['git', 'show-ref', '--verify', f'refs/tags/{tag}'], check=True)
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'HEAD', 'origin/main'], check=True)
          PY
      - name: Build distributions
        run: |
          python -m pip install build twine pytest pytest-asyncio numpy prometheus_client
          python -m build
          python -m twine check --strict dist/*
          python -m pip install dist/*.whl
      - name: Test installed wheel
        run: |
          python -I - <<'PY'
          import importlib.metadata, os, pathlib, tomllib
          import loco, pytest
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          with (root / 'pyproject.toml').open('rb') as source:
              version = tomllib.load(source)['project']['version']
          assert loco.__version__ == importlib.metadata.version('loco-agent') == version
          assert 'site-packages' in pathlib.Path(loco.__file__).parts, loco.__file__
          raise SystemExit(pytest.main(['-q', '--import-mode=importlib', str(root / 'tests')]))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/loco-agent
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-distributions
          path: dist/
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
