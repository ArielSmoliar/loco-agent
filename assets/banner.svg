<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="50%" style="stop-color:#1b2d45"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100"/>
      <stop offset="100%" style="stop-color:#bf360c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e65100;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#e65100;stop-opacity:0"/>
    </linearGradient>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Glow behind icon -->
  <circle cx="280" cy="150" r="120" fill="url(#glow)"/>

  <!-- Icon: stylized gauge/load meter -->
  <g transform="translate(280, 150)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#e65100" stroke-width="3" opacity="0.6"/>
    <!-- Inner ring -->
    <circle cx="0" cy="0" r="40" fill="#e65100" opacity="0.15"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#e65100" stroke-width="2"/>

    <!-- Gauge needle pointing up-right (high load) -->
    <line x1="0" y1="0" x2="20" y2="-28" stroke="#ff6d00" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#ff6d00"/>

    <!-- Tick marks -->
    <line x1="-28" y1="16" x2="-22" y2="12" stroke="#e65100" stroke-width="1.5" opacity="0.5"/>
    <line x1="-28" y1="-16" x2="-22" y2="-12" stroke="#e65100" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-32" x2="0" y2="-26" stroke="#e65100" stroke-width="1.5" opacity="0.7"/>
    <line x1="28" y1="-16" x2="22" y2="-12" stroke="#e65100" stroke-width="1.5" opacity="0.9"/>
    <line x1="28" y1="16" x2="22" y2="12" stroke="#e65100" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="420" y="110" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#e65100">LOCO-AGENT</text>
  <text x="420" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff">Load-Conscious Orchestration</text>
  <text x="420" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94a3b8">Scheduling layer for multi-agent AI systems -- priority, concurrency, cost governance</text>

  <!-- Accent line -->
  <rect x="420" y="218" width="60" height="3" rx="1.5" fill="#e65100"/>
</svg>
