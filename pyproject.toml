[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loco-agent"
version = "0.4.0"
description = "Load-aware scheduling layer for multi-agent systems"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.10"
authors = [
    {name = "Ariel Smoliar", email = "ariel@loco-agent.dev"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Framework :: AsyncIO",
]

[project.scripts]
loco = "loco.cli:main"

[tool.setuptools.packages.find]
include = ["loco*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "numpy>=1.24",
    "prometheus_client>=0.20",
]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
prometheus = ["prometheus_client>=0.20"]
all = ["loco-agent[anthropic,openai,prometheus]"]

[project.urls]
Homepage = "https://github.com/ArielSmoliar/loco-agent"
Repository = "https://github.com/ArielSmoliar/loco-agent"
Issues = "https://github.com/ArielSmoliar/loco-agent/issues"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# simulation/ is article-reproducibility tooling, not library code: the notebook
# builder embeds long markdown/LaTeX content strings (E501), and the sim uses
# math-convention uppercase names like N, Q, Dmax (N806). Library code in loco/
# keeps the full ruleset.
"simulation/*" = ["E501", "N806"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
